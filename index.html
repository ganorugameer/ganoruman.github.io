<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganoruman</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #080b12;
            color: white;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 7%;
            background: rgba(10, 14, 24, 0.96);
            border-bottom: 1px solid #222a3a;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        nav a {
            color: #dbe4f5;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #4d8dff;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 20px;

            background:
                radial-gradient(
                    circle at center,
                    #17264a 0%,
                    #080b12 65%
                );
        }

        .hero h1 {
            font-size: clamp(50px, 9vw, 100px);
            margin: 0;
        }

        .hero p {
            max-width: 650px;
            color: #aeb9cc;
            font-size: 20px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }

        .button:hover {
            background: #3b82f6;
        }

        section {
            padding: 80px 7%;
        }

        section h2 {
            text-align: center;
            font-size: 36px;
        }

        #projects-container {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        #downloads-container {
            max-width: 900px;
            margin: auto;
        }

        .empty {
            text-align: center;
            color: #788398;
            padding: 40px;
        }
